<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LudoEdu</title>
  <link rel="stylesheet" href="shared/styles.css">
  <style>
    :root {
      --primary: #6c5ce7;
      --bg: #f4f2ff;
      --surface: #ffffff;
      --surface2: #eeebff;
      --text: #2d3436;
      --text-muted: #636e72;
      --border: #dfe6e9;
      --radius: 18px;
      --shadow: 0 4px 24px rgba(108,92,231,.14);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); }

    .layout {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
      gap: 40px;
    }

    .header { text-align: center; }
    .header h1 {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -1px;
    }
    .header p {
      margin-top: 6px;
      font-size: 15px;
      color: var(--text-muted);
    }

    .games {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .game-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 32px 28px;
      width: 240px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
      transition: transform .15s, box-shadow .15s;
      border: 2px solid transparent;
    }
    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 32px rgba(108,92,231,.22);
      border-color: var(--primary);
    }
    .game-card.soon {
      opacity: .55;
      pointer-events: none;
    }

    .game-icon { font-size: 3rem; line-height: 1; }

    .game-name {
      font-size: 1.1rem;
      font-weight: 700;
      text-align: center;
    }
    .game-desc {
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.4;
    }
    .game-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--primary);
      margin-top: 4px;
    }
    .game-badge.soon { background: #f0f0f0; color: var(--text-muted); }

    .dashboard-link {
      position: fixed;
      top: 18px;
      right: 22px;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary);
      text-decoration: none;
      background: var(--surface);
      padding: 9px 16px;
      border-radius: 20px;
      box-shadow: var(--shadow);
      transition: transform .15s;
    }
    .dashboard-link:hover { transform: translateY(-2px); }
  </style>
</head>
<body>
<a href="shared/dashboard.html" class="dashboard-link">🛠 Tableau de bord</a>
<div class="layout">

  <header class="header">
    <h1>LudoEdu</h1>
    <p>Plateforme de jeux pédagogiques</p>
  </header>

  <div class="games">

    <a href="cliconvocabulary/index.html?lang=en" class="game-card">
      <div class="game-icon">🇬🇧</div>
      <div class="game-name">CliConVocabulary — Anglais</div>
      <div class="game-desc">Apprendre le vocabulaire anglais avec des images</div>
      <div class="game-badge">Jouer</div>
    </a>

    <a href="cliconvocabulary/index.html?lang=de" class="game-card">
      <div class="game-icon">🇩🇪</div>
      <div class="game-name">CliConVocabulary — Allemand</div>
      <div class="game-desc">Apprendre le vocabulaire allemand avec des images</div>
      <div class="game-badge">Jouer</div>
    </a>

    <a href="calcnplay/index.html" class="game-card">
      <div class="game-icon">🔢</div>
      <div class="game-name">CalcNPlay</div>
      <div class="game-desc">Jeu de calcul mental</div>
      <div class="game-badge">Jouer</div>
    </a>

  </div>

</div>
</body>
</html>
