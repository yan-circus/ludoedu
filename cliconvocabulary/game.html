<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="icon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CliConVocabulary</title>
  <link rel="stylesheet" href="../shared/styles.css">
  <link rel="stylesheet" href="game.css">
</head>
<body>
<div class="game-layout">

  <!-- ══ Header ══════════════════════════════════════════════════════════════ -->
  <header class="game-header">
    <a href="index.html" class="game-stop-btn" title="Quitter">⏹</a>
    <div class="question-zone" id="question-zone">
      <div class="question-hint">Chargement…</div>
    </div>
    <div class="game-lives-area">
      <div class="game-score"><span id="score-val">0</span></div>
      <div class="game-lives" id="lives-zone"></div>
    </div>
    <div class="game-player">
      <img id="game-avatar" class="game-avatar" src="" alt="">
      <span id="game-player-name"></span>
    </div>
  </header>

  <!-- ══ Body ════════════════════════════════════════════════════════════════ -->
  <div class="game-body" id="game-body">
    <!-- chrono bar and learning list inserted by JS -->
    <div class="game-image-area" id="game-image-area">
      <img id="game-image" alt="" draggable="false">
      <svg id="game-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="game-counter" id="game-counter"></div>
    </div>
  </div>

</div>

<!-- Feedback toast -->
<div id="feedback-toast" class="feedback-toast hidden"></div>

<span id="version-display" class="version-display"></span>
<button id="fullscreen-btn" class="fullscreen-btn" title="Plein écran">
  <svg id="fs-expand" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
    <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
  </svg>
  <svg id="fs-compress" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
    <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
    <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>
  </svg>
</button>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="langs.js"></script>
<script src="game-config.js"></script>
<script src="../shared/firebase-core.js"></script>
<script src="../shared/platform-methods.js"></script>
<script src="firebase-service.js"></script>
<script src="game.js"></script>
</body>
</html>
